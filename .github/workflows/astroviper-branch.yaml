name: Build and test astroviper branch with asv
on:
  workflow_dispatch:
  push:
    paths:
      - 'astroviper/**' # The workflow runs only for changes in this directory 
    branches-ignore:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v4
      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y "gcc-14" "g++-14"
          # Make the requested compiler the one CMake/scikit-build-core picks up
          # for the pip build below (env persists to later steps via GITHUB_ENV).
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          "g++-14" --version
      - name: Build and test
        run: |
          # if environment_type "existing", install project and dependencies
          # otherwise, just need asv and selected environment manager
          pip install asv virtualenv
          # benchviper organizes each external project in its own subdir
          cd astroviper
          asv machine --machine gh-runner --yes
          asv run HEAD^1..HEAD --machine gh-runner --parallel --interleave-rounds --skip-existing --show-stderr
          asv publish
      - name: Archive results
        uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: publish-results
          path: /home/runner/work/benchviper/benchviper/astroviper/results/gh-runner/*.json
      - name: Archive generated html
        uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: publish-html
          path: /home/runner/work/benchviper/benchviper/astroviper/html/*
