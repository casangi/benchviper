name: Build and test astroviper branch with asv
# Push to a branch: benchmark the Python 3.13 environment only.
# Pull request / manual run: every environment in astroviper/asv.conf.json
# (Python 3.12, 3.13 and 3.14).
on:
  workflow_dispatch:
  push:
    paths:
      - 'astroviper/**' # The workflow runs only for changes in this directory
    branches-ignore:
      - main
  pull_request:
    paths:
      - 'astroviper/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # asv's virtualenv plugin needs every interpreter listed in
          # asv.conf.json "pythons" on PATH (it silently skips a missing one).
          # The last version listed becomes the default `python`, which runs
          # asv itself.
          python-version: |
            3.12
            3.14
            ${{ matrix.python-version }}
      - name: Check the asv interpreters are available
        run: python3.12 -V && python3.13 -V && python3.14 -V
      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y "gcc-14" "g++-14"
          # Make the requested compiler the one CMake/scikit-build-core picks up
          # for the pip build below (env persists to later steps via GITHUB_ENV).
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          "g++-14" --version
      - name: Build and test
        env:
          # On a branch push only the 3.13 environment is benchmarked.
          ASV_ENV_ARGS: ${{ github.event_name == 'push' && '-E virtualenv:3.13' || '' }}
        run: |
          # if environment_type "existing", install project and dependencies
          # otherwise, just need asv and selected environment manager
          pip install asv virtualenv
          # benchviper organizes each external project in its own subdir
          cd astroviper
          asv machine --machine gh-runner --yes
          # shellcheck disable=SC2086  # ASV_ENV_ARGS is empty or "-E virtualenv:3.13"
          asv run HEAD^1..HEAD $ASV_ENV_ARGS --machine gh-runner --parallel --interleave-rounds --skip-existing
          asv publish --verbose
      - name: Archive results
        uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: publish-results
          path: /home/runner/work/benchviper/benchviper/astroviper/results/gh-runner/*.json
      - name: Archive generated html
        uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: publish-html
          path: /home/runner/work/benchviper/benchviper/astroviper/html/*
