name: Build and test xradio with asv
'on':
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Source repository that triggered the dispatch'
        required: false
        type: string
      source_ref:
        description: 'Source branch/ref that triggered the dispatch'
        required: false
        type: string
      source_sha:
        description: 'Source commit SHA that triggered the dispatch'
        required: false
        type: string
      source_actor:
        description: 'Source actor that triggered the dispatch'
        required: false
        type: string
      source_workflow:
        description: 'Source workflow that triggered the dispatch'
        required: false
        type: string
      source_run_id:
        description: 'Source run ID that triggered the dispatch'
        required: false
        type: string
      source_run_number:
        description: 'Source run number that triggered the dispatch'
        required: false
        type: string
      triggered_by:
        description: 'How this workflow was triggered'
        required: false
        type: string
permissions:
  contents: write
# Serialize runs: each one commits and pushes asv results to main, and a 3-Python
# run takes long enough for overlapping dispatches to race on that push.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.13"
    steps:
      - name: Log dispatch information
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Workflow triggered by repository dispatch"
          echo "Source repository: ${{ github.event.inputs.source_repository }}"
          echo "Source ref: ${{ github.event.inputs.source_ref }}"
          echo "Source SHA: ${{ github.event.inputs.source_sha }}"
          echo "Source actor: ${{ github.event.inputs.source_actor }}"
          echo "Source workflow: ${{ github.event.inputs.source_workflow }}"
          echo "Source run ID: ${{ github.event.inputs.source_run_id }}"
          echo "Source run number: ${{ github.event.inputs.source_run_number }}"
          echo "Triggered by: ${{ github.event.inputs.triggered_by }}"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # asv's virtualenv plugin needs every interpreter listed in
          # asv.conf.json "pythons" on PATH (it silently skips a missing one).
          # The last version listed becomes the default `python`, which runs
          # asv itself.
          python-version: |
            3.12
            3.14
            ${{ matrix.python-version }}
      - name: Check the asv interpreters are available
        run: python3.12 -V && python3.13 -V && python3.14 -V
      - name: Build and test
        env:
          # Older xradio commits pin numcodecs<0.16, which has no cp314 wheel;
          # its bundled c-blosc does not compile as C23 (GCC >= 15's default).
          CFLAGS: "-std=gnu17"
        run: |
          # if environment_type "existing", install project and dependencies
          # otherwise, just need asv and selected environment manager
          pip install asv virtualenv
          # benchviper organizes each external project in its own subdir
          cd xradio
          asv machine --machine gh-runner --yes
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # If triggered by a dispatch, run the last 3 commits on main
            asv run "--merges main~3..main" --machine gh-runner --parallel --interleave-rounds --skip-existing-successful
          else
            # Otherwise, run from the v1.0.2 tag to main 
            asv run --verbose "--merges v1.0.2..main" --machine gh-runner --parallel --interleave-rounds --skip-existing-successful
          fi
      - name: Push results
        if: "!cancelled() && github.ref == 'refs/heads/main'"
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          if git status --porcelain xradio/results/gh-runner/ | grep .; then
            git add /home/runner/work/benchviper/benchviper/xradio/results/gh-runner/
            git commit -m "Automated push of results from github action"
            git push
          else
            echo "No new results detected for gh-runner machine entry in asv database"
          fi
      - name: Build HTML
        if: '!cancelled()'
        run: |
          cd xradio
          asv publish --verbose
      - name: Deploy to GitHub Pages
        if: "!cancelled() && github.ref == 'refs/heads/main'"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./xradio/html
          destination_dir: xradio
          keep_files: true
      - name: Archive generated html
        uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: publish-html
          path: /home/runner/work/benchviper/benchviper/xradio/html/*
