name: Build and test xradio branch with asv
# Push to a branch: benchmark the Python 3.13 environment only.
# Pull request / manual run: every environment in xradio/asv.conf.json.
on:
  workflow_dispatch:
  push:
    paths:
      - 'xradio/**' # The workflow runs only for changes in this directory
    branches-ignore:
      - main
  pull_request:
    paths:
      - 'xradio/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the Pythons in asv.conf.json
        id: asv-pythons
        run: |
          # asv benchmarks one environment per Python in the "pythons" list of
          # asv.conf.json. The file allows // comments, so only that list is parsed.
          python3 - xradio/asv.conf.json >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys

          text = re.sub(r"(?m)^\s*//.*$", "", open(sys.argv[1]).read())
          found = re.search(r'"pythons"\s*:\s*(\[[^\]]*\])', text)
          if found is None:
              sys.exit(f'No "pythons" list in {sys.argv[1]}')
          print("versions<<PYTHONS", *json.loads(found[1]), "PYTHONS", sep="\n")
          PY
      - uses: actions/setup-python@v7
        with:
          # asv's virtualenv plugin needs every interpreter in "pythons" on PATH
          # (it silently skips a missing one). The last one listed becomes the
          # default `python`, which runs asv itself.
          python-version: ${{ steps.asv-pythons.outputs.versions }}
      - name: Check the asv interpreters are available
        env:
          ASV_PYTHONS: ${{ steps.asv-pythons.outputs.versions }}
        run: for version in $ASV_PYTHONS; do "python$version" -V; done
      - name: Build and test
        env:
          # Older xradio commits pin numcodecs<0.16, which has no cp314 wheel;
          # its bundled c-blosc does not compile as C23 (GCC >= 15's default).
          CFLAGS: "-std=gnu17"
          # A branch push benchmarks only the 3.13 environment of asv.conf.json:
          # -E selects it for this run (asv.conf.json is not changed, and its
          # matrix and excludes still apply). Otherwise every environment runs.
          ASV_ENV_ARGS: ${{ github.event_name == 'push' && '-E virtualenv:3.13' || '' }}
        run: |
          # if environment_type "existing", install project and dependencies
          # otherwise, just need asv and selected environment manager
          pip install asv virtualenv
          # benchviper organizes each external project in its own subdir
          cd xradio
          asv machine --machine gh-runner --yes
          # shellcheck disable=SC2086  # ASV_ENV_ARGS is empty or "-E virtualenv:3.13"
          asv run HEAD^1..HEAD $ASV_ENV_ARGS --machine gh-runner --parallel --interleave-rounds --skip-existing --verbose --show-stderr
          asv publish --verbose
      - name: Archive results
        uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: publish-results
          path: /home/runner/work/benchviper/benchviper/xradio/results/gh-runner/*.json
      - name: Archive generated html
        uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: publish-html
          path: /home/runner/work/benchviper/benchviper/xradio/html/*
